# Website for the MD exercise (separate from the course site in ../../course_notes).
# Build from this folder: pixi r quarto render  (or: pixi r quarto preview)
project:
  type: website
  output-dir: _site/
  # Only these pages; README.md and the notebook are not part of the website
  render:
    - index.qmd
    - visualisation.qmd
    - analysis.qmd
  resources:
    - web_data/

website:
  title: "MD simulations"
  sidebar:
    style: "docked"
    contents:
      - href: index.qmd
        text: Overview
        icon: house
      - href: visualisation.qmd
        text: "1) Visualisation"
      - href: analysis.qmd
        text: "2) Analysis"

# analysis.qmd uses format live-html (in-browser Python), which does not inherit these settings:
# keep the copy in its header in sync
format:
  html:
    theme:
      light: flatly
      dark: darkly
    toc: true
