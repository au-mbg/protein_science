name: Build and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.72.1
          cache: true
      - run: |
          pixi r render exercise
          pixi r render solution

      # MD exercise: its own small website in md_exercise/, published at <site>/md_exercise/
      - name: Build MD exercise website
        working-directory: md_exercise
        run: |
          pixi r quarto render --profile exercise
          pixi r quarto render --profile solution
          cp -r _site ../course_notes/_site/md_exercise

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: course_notes/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
