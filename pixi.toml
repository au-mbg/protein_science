[workspace]
authors = ["Mads-Peter <machri@phys.au.dk>"]
channels = ["conda-forge"]
name = "protein_science"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[tasks.render]
cmd = "quarto render"
cwd = "course_notes"

[tasks.preview]
cmd = "quarto preview"
cwd = "course_notes"

[tasks]

[dependencies]
python = "==3.12"
quarto = ">=1.9.38,<2"
jupyter = ">=1.1.1,<2"
matplotlib = ">=3.11.1,<4"
numpy = ">=2.5.1,<3"
scipy = ">=1.18.0,<2"
pandas = ">=3.0.3,<4"
